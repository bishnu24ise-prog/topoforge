[project]
name = "topoforge"
version = "2.1.0"
description = "Explore any place on Earth as real 3D terrain with AI Voice Guide and Wispr Flow voice controls."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "google-genai>=1.57.0",
    "numpy>=2.4.0",
    "pillow>=12.1.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "rasterio>=1.5.0",
    "uvicorn>=0.40.0",
    "supabase>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/bishnu24ise-prog/TopoForge"
Repository = "https://github.com/bishnu24ise-prog/TopoForge.git"
