[project]
name = "topoforge"
version = "1.0.0"
description = "Upload any map. Explore terrain in 3D with an AI tour guide."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "google-genai>=1.57.0",
    "numpy>=2.4.0",
    "pillow>=12.1.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "rasterio>=1.5.0",
    "uvicorn>=0.40.0",
    "supabase>=2.10.0",
]
